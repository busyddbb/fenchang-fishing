 if(!x&&!y&&target){x=target.x-b.x;y=target.y-b.y;if(Math.hypot(x,y)<3){target=null;x=y=0}}
 let speed=0;if(state==='row'&&(x||y)){const want=Math.atan2(y,x),da=Math.atan2(Math.sin(want-b.yaw),Math.cos(want-b.yaw));b.yaw+=clamp(da,-3.1*dt,3.1*dt);speed=42*(.22+.78*Math.max(0,Math.cos(da)));if(target)speed*=Math.min(1,Math.hypot(x,y)/14)}

}
function updateFish(dt){for(const f of fishes){if(cast?.fish===f&&['soak','lift'].includes(state))continue;const a=t*f.rate+f.ph;const dx=f.cx+Math.cos(a)*f.r-f.x,dy=f.cy+Math.sin(a*.81)*f.r*.68-f.y;const k=Math.min(1,dt*6/Math.max(.1,Math.hypot(dx,dy)));if(Math.hypot(dx,dy)>.05)f.yaw=Math.atan2(dy,dx);f.x+=dx*k;f.y+=dy*k}}

function sprite(im,x,y,w,h,angle=0,mirror=false){g.save();g.translate(x,y);g.rotate(angle);if(mirror)g.scale(-1,1);g.drawImage(im,-w/2,-h/2,w,h);g.restore()}
function ellipse(x,y,rx,ry,fill){g.fillStyle=fill;g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fill()}
function stroke(x,y,xx,yy,col,width=1){g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.stroke()}
function drawFish(){for(const f of fishes){if(cast?.fish===f&&state==='lift'&&cast.won)continue;const bright=cast?.fish===f&&state==='soak';g.globalAlpha=(bright?.28:.14+.07*Math.sin(t*.8+f.ph))*(1-(f.submerge||0)*.85);const im=img['鱼'+f.id],w=f.sz*(1+.035*Math.sin(t*5+f.ph));let left=Math.cos(f.yaw)<0;sprite(im,f.x,f.y,w,w*im.height/im.width*.74,Math.sin(f.yaw)*(left?-.5:.5),left)}g.globalAlpha=1}
function drawBoat(){const drift=Math.sin(t*1.65)*.48,by=b.y+drift;const row=b.v/42;const tipSide=Math.cos(b.yaw)>=0?1:-1;
 ellipse(b.x+1,b.y+4,18,4.5,'#033e635f');
 // The hull turns continuously; the seated cat stays upright in the aerial view.
 const rot=Math.atan2(Math.sin(b.yaw)*.8,Math.cos(b.yaw));
 g.save();g.translate(b.x,by);g.rotate(rot);const swing=Math.sin(t*5.2)*row;for(const s of [-1,1]){const xx=-2+swing*3,yy=s*(8+row*3);stroke(1,s*2,xx,yy,'#704631',1.1);stroke(xx,yy,xx-1.5,yy+s*2.8,'#edb565',1.9)}g.restore();
 g.save();g.translate(b.x,by);g.rotate(rot);
 const flip=ease(clamp((.18-Math.cos(b.yaw))/.36,0,1));
 if(flip<1){g.globalAlpha=1-flip;g.drawImage(img['船'],-21,-7.5,42,15)}
 if(flip>0){g.globalAlpha=flip;g.scale(1,-1);g.drawImage(img['船'],-21,-7.5,42,15)}
 g.restore();
 let cx=b.x-2,cy=by-8,catW=16;if(state==='shore'||state==='boarding'){const k=state==='shore'?0:ease(clamp(age/1.05,0,1));cx=mix(dock.x,b.x-2,k);cy=mix(dock.y-7,by-8,k)-Math.sin(Math.PI*k)*13}
 sprite(img['猫'],cx,cy+Math.sin(t*2)*.23,catW,catW*img['猫'].height/img['猫'].width,Math.sin(t*1.4)*.018,tipSide<0);
 if(cast){const s=cast.side,rx=b.x+14*s,ry=by-23;stroke(b.x+s*3,by-9,rx,ry,'#61422c',1);stroke(b.x+s*3,by-9,rx-.8*s,ry,'#edc88e',.45);
 g.lineWidth=.48;g.strokeStyle='#f1f1d4c0';g.beginPath();g.moveTo(rx,ry);g.quadraticCurveTo((rx+cast.lineX)/2,(ry+cast.lineY)/2+4,cast.lineX,cast.lineY);g.stroke();
 if(state==='lift'&&cast.won){const im=img['鱼'+cast.fish.id];sprite(im,cast.lineX,cast.lineY,13,13*im.height/im.width,-.7)}
 else{const dip=state==='soak'&&cast.engaged;ellipse(cast.lineX,cast.lineY,1.7,.55,'#173f6280');g.fillStyle='#fff5d5';g.fillRect(cast.lineX-.8,cast.lineY-(dip?.7:2.5),1.6,dip?.7:2.5);g.fillStyle='#e68a6c';g.fillRect(cast.lineX-.8,cast.lineY-(dip?1.1:3.8),1.6,dip?.4:1.4)}}
}
const glints=Array.from({length:180},()=>({x:rnd()*W,y:40+rnd()*(H-40),p:rnd()*TAU,r:1+rnd()*2.5}));
function render(){const k=camera.k;g.setTransform(pixel*k,0,0,pixel*k,pixel*(sw/2-camera.x*k),pixel*(sh/2-camera.y*k));g.drawImage(img['荷塘'],0,0,W,H);
 for(const a of glints){const s=Math.sin(t*.9+a.p+a.y*.09);if(s>.66&&a.y>160-a.x*.34){g.fillStyle='rgba(181,232,221,'+((s-.66)*.45)+')';g.fillRect(a.x+Math.sin(t*.37+a.p)*2,a.y,a.r,.6)}}
 drawFish();for(const p of foam){let v=p.age/p.life;if(v>=1)continue;g.globalAlpha=.62*(1-v);g.fillStyle=p.seed>.5?'#ebf9e9':'#8fced7';g.save();g.translate(p.x,p.y);g.rotate(p.dir+p.side*(.3+.15*v));g.fillRect(-p.r,0,p.r*(2.1+v),p.r*(1-v*.5));g.fillRect(-p.r*2,1.6,p.r*.75,.68);if(p.seed>.45)g.fillRect(-2.3*p.r,-1.45,p.r*.85,.6);g.restore()}g.globalAlpha=1;
 for(const r of rings){let a=r.age/1.55,rad=.6+r.r*a;g.lineWidth=.58;g.strokeStyle='rgba(213,242,231,'+Math.max(0,.75*(1-a))+')';g.beginPath();g.ellipse(r.x,r.y,rad,rad*.42,0,.18,5.88);g.stroke()}drawBoat()}
let audio,amp,on=false;function tone(hz,len){if(!on||!audio)return;const o=audio.createOscillator(),v=audio.createGain();o.frequency.setValueAtTime(hz,audio.currentTime);o.frequency.exponentialRampToValueAtTime(hz*.55,audio.currentTime+len);v.gain.setValueAtTime(.09,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(v).connect(amp);o.start();o.stop(audio.currentTime+len)}
$('#sound').onclick=async()=>{try{if(!audio){audio=new AudioContext();amp=audio.createGain();amp.gain.value=0;amp.connect(audio.destination);const buf=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),d=buf.getChannelData(0);let a=0;for(let i=0;i<d.length;i++)d[i]=a=(a+(Math.random()-.5)*.06)*.98;const src=audio.createBufferSource();src.buffer=buf;src.loop=true;src.connect(amp);src.start()}await audio.resume();on=!on;amp.gain.setTargetAtTime(on?.23:0,audio.currentTime,.15);$('#sound').textContent='水声 · '+(on?'开':'关');$('#sound').setAttribute('aria-pressed',String(on))}catch{}};
$('#board').onclick=()=>{open.hidden=true;shift('boarding');tone(290,.13)};act.onclick=action;
$('#book').onclick=()=>{const grid=$('.grid');grid.replaceChildren();fishNames.forEach((n,i)=>{const seen=discovered.has(i),e=document.createElement('div'),icon=new Image(),label=document.createElement('span');e.className='entry'+(seen?'':' unknown');icon.src=files['鱼'+i];icon.alt='';label.textContent=seen?n:'未曾相遇';e.append(icon,label);grid.append(e)});dialog.showModal();held.clear()};$('.close').onclick=()=>dialog.close();
function navigate(e){const x=camera.x+(e.clientX-sw/2)/camera.k,y=camera.y+(e.clientY-sh/2)/camera.k;target=water({x,y});tip.hidden=true}
cv.onpointerdown=e=>{if(state!=='row'||dialog.open||pointer!==null)return;pointer=e.pointerId;cv.setPointerCapture(pointer);navigate(e);ring(target.x,target.y,4)};cv.onpointermove=e=>{if(e.pointerId===pointer&&state==='row')navigate(e)};cv.onpointerup=cv.onpointercancel=cv.onlostpointercapture=()=>pointer=null;
addEventListener('keydown',e=>{if(dialog.open||['shore','boarding'].includes(state))return;if(['KeyW','KeyA','KeyS','KeyD','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)){e.preventDefault();if(e.code==='Space'){if(!e.repeat)action()}else held.add(e.code)}});addEventListener('keyup',e=>held.delete(e.code));addEventListener('blur',()=>{held.clear();pointer=null});
Promise.all(Object.entries(files).map(async([n,url])=>{const im=new Image();im.src=url;await im.decode();img[n]=im})).then(()=>{camera.k=Math.max(sw/(sw<600?185:445),sw/W,sh/H);update(0);render();$('#board').disabled=false;let last=performance.now();function frame(now){const dt=Math.min(.06,(now-last)/1000);last=now;if(!document.hidden){if(!dialog.open)update(dt);render()}requestAnimationFrame(frame)}requestAnimationFrame(frame)});

</script></body></html>
